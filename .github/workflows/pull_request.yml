name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'ml-explore/mlx-swift-lm'
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2-rhel-ubi9
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Setup pre-commit
        shell: sh
        run: |
          uv pip install pre-commit

      - name: Get swift-format tag
        id: swift-format
        shell: sh
        run: |
          # Pinned instead of releases/latest: a new swift-format release can
          # change formatting rules and reformat files no PR touched, turning
          # the whole-repo `pre-commit run --all` red on every open PR at once.
          # Bump this deliberately (with the matching reformat) rather than
          # tracking latest. 603.0.0 is what `latest` resolved to at pin time.
          echo "SWIFT_FORMAT_VERSION=603.0.0" >> $GITHUB_OUTPUT

      - name: Cache swift-format build
        uses: actions/cache@v4
        id: cache-swift-format
        with:
          path: /tmp/swift-format/.build
          key: ${{ runner.os }}-swift-format-build-${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }}

      - name: Build swift-format
        if: steps.cache-swift-format.outputs.cache-hit != 'true'
        shell: sh
        run: |
          cd /tmp
          git clone --branch ${{ steps.swift-format.outputs.SWIFT_FORMAT_VERSION }} --depth 1 https://github.com/swiftlang/swift-format.git
          cd swift-format
          swift build -c release

      - name: Link swift-format to /usr/local/bin
        shell: sh
        run: |
          cd /tmp/swift-format
          ln -s "$(swift build --show-bin-path -c release)/swift-format" /usr/local/bin/swift-format

      - name: Configure safe directory for git
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run style checks
        shell: sh
        run: |
          pre-commit run --all || (echo "Style checks failed, please install pre-commit and run pre-commit run --all and push the change"; echo ""; git --no-pager diff; exit 1)

  # Runs the tests for .github/scripts/ci-state.js, which picks the CI state
  # labels. Node has a built-in test runner, so this job needs no install step.
  #
  # A pull request runs its own copy of these tests and can weaken them. That
  # cannot change the labels, because ci-state.yml runs the script from a
  # repository branch, not from the pull request. This job makes a change to
  # either file turn the check red.
  ci_state_script:
    if: github.repository == 'ml-explore/mlx-swift-lm'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # This number must equal CONTRACT in .github/scripts/ci-state.js on the
      # default branch, not in this branch's copy. If you rename a step, change
      # both numbers in one commit. Keep this step first: a failure in any other
      # step then cannot stop it running.
      - name: "Contract: 1"
        shell: bash
        run: echo "CI state contract 1"

      - uses: actions/checkout@v6

      - name: Test the CI state classifier
        shell: bash
        run: |
          node --version
          node --test .github/scripts/ci-state.test.js

  mac_build_and_test:
    needs: lint
    if: github.repository == 'ml-explore/mlx-swift-lm'
    runs-on: [self-hosted, macos]
    env:
      DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
      # xcodebuild does not forward DEVELOPER_DIR to xctest. MLX's CPU JIT runs g++
      # from inside the tests, so pass it with the TEST_RUNNER_ prefix.
      TEST_RUNNER_DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Xcode and Swift versions
        shell: sh
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swift --version
          ls -l /Applications/Xcode-latest.app
          ls /Applications | grep -i xcode

      - name: "Infra: verify MetalToolchain installed"
        shell: bash
        run: xcodebuild -showComponent MetalToolchain

      - name: Verify documentation
        run: scripts/verify-docs.sh

      - name: Build (Xcode, macOS)
        shell: sh
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcodebuild build-for-testing -skipPackagePluginValidation -scheme mlx-swift-lm-Package -destination 'platform=macOS'

      - name: Run Tests (Xcode, macOS)
        shell: sh
        run: |
          xcodebuild test -skipPackagePluginValidation -scheme mlx-swift-lm-Package \
            -destination 'platform=macOS' -resultBundlePath MLXSwiftLMTests.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            MLXSwiftLMTests.xcresult
            ~/Library/Logs/DiagnosticReports/*
          retention-days: 7
